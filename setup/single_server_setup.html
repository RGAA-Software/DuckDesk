<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixels Server Setup</title>
  <style>
    :root { color-scheme: light dark; --surface: #fff; --canvas: #f4f6f8; --text: #202733; --muted: #586575; --border: #d7dde5; --accent: #087b64; --error: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --surface: #202733; --canvas: #111820; --text: #f4f6f8; --muted: #b8c3d0; --border: #3d4a59; --accent: #37b99a; --error: #ff8b80; } }
    * { box-sizing: border-box; }
    body { background: var(--canvas); color: var(--text); font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px 16px; }
    main { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin: auto; max-width: 760px; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { color: var(--muted); margin: 0 0 24px; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, textarea { background: var(--canvas); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font: inherit; padding: 10px 12px; width: 100%; }
    textarea { min-height: 130px; resize: vertical; }
    button { background: var(--accent); border: 0; border-radius: 8px; color: #fff; cursor: pointer; font: inherit; font-weight: 600; padding: 11px 20px; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { color: var(--muted); margin-top: 20px; white-space: pre-wrap; }
    #status.error { color: var(--error); }
    .pair { display: grid; gap: 16px; grid-template-columns: 1fr 160px; }
    @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1 data-i18n="title"></h1>
  <p data-i18n="intro"></p>
  <form id="setup-form" autocomplete="off">
    <div class="pair">
      <label><span data-i18n="pgHost"></span><input name="postgresql_host" required autocomplete="off"></label>
      <label><span data-i18n="pgPort"></span><input name="postgresql_port" type="number" min="1" max="65535" value="5432" required></label>
    </div>
    <label><span data-i18n="pgUser"></span><input name="postgresql_administrator" required autocomplete="off"></label>
    <label><span data-i18n="pgPassword"></span><input name="postgresql_password" type="password" required autocomplete="new-password"></label>
    <label><span data-i18n="pgCa"></span><textarea name="postgresql_ca_pem" required spellcheck="false" placeholder="-----BEGIN CERTIFICATE-----"></textarea></label>
    <label><span data-i18n="publicHost"></span><input name="public_host" required autocomplete="off"></label>
    <label><span data-i18n="adminUser"></span><input name="initial_username" required autocomplete="off"></label>
    <label><span data-i18n="adminPassword"></span><input name="initial_password" type="password" required autocomplete="new-password"></label>
    <button type="submit" data-i18n="submit"></button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
  const catalogs = {
    zh: {
      title: "Pixels Server 首次初始化",
      intro: "PostgreSQL 18 需由您单独安装。填写一次性数据库管理员信息和 CA 证书；初始化后只保留专用运行账户，许可证稍后在 Console 管理网页导入。此页面仅在服务器本机开放。",
      pgHost: "PostgreSQL 主机名", pgPort: "PostgreSQL 端口", pgUser: "PostgreSQL 超级用户", pgPassword: "PostgreSQL 密码",
      pgCa: "PostgreSQL CA 证书（PEM 内容）", publicHost: "本服务器的公网域名或 IP", adminUser: "Pixels 初始管理员用户名",
      adminPassword: "Pixels 初始管理员密码", submit: "初始化并启动服务", working: "正在初始化，请勿关闭此页面……",
      success: "初始化完成。部署 ID：{id}\nConsole：{origin}\n请在 Console 管理页导入 PXLIC2 许可证。",
      error: "初始化失败：{reason}。请检查输入和服务器日志；已创建的数据库资源不会自动删除。"
    },
    en: {
      title: "Pixels Server first-time setup",
      intro: "Install PostgreSQL 18 separately. Enter its one-time administrator credentials and CA certificate. Only dedicated runtime accounts remain afterward; import the license in Console. This page is available only on the server itself.",
      pgHost: "PostgreSQL host", pgPort: "PostgreSQL port", pgUser: "PostgreSQL superuser", pgPassword: "PostgreSQL password",
      pgCa: "PostgreSQL CA certificate (PEM contents)", publicHost: "Public server DNS name or IP", adminUser: "Initial Pixels administrator name",
      adminPassword: "Initial Pixels administrator password", submit: "Initialize and start services", working: "Initializing; keep this page open…",
      success: "Setup complete. Deployment ID: {id}\nConsole: {origin}\nImport the PXLIC2 license in Console administration.",
      error: "Setup failed: {reason}. Check the fields and server log. Created database resources are not removed automatically."
    }
  };
  const language = navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
  const words = catalogs[language];
  document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
  for (const element of document.querySelectorAll("[data-i18n]")) element.textContent = words[element.dataset.i18n];
  const form = document.getElementById("setup-form");
  const status = document.getElementById("status");
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const submitButton = form.querySelector("button");
    submitButton.disabled = true;
    status.classList.remove("error");
    status.textContent = words.working;
    const fields = Object.fromEntries(new FormData(form));
    fields.postgresql_port = Number(fields.postgresql_port);
    try {
      const response = await fetch("/initialize", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(fields) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || String(response.status));
      status.textContent = words.success.replace("{id}", result.deployment_id).replace("{origin}", result.console_origin);
      form.remove();
    } catch (error) {
      status.classList.add("error");
      status.textContent = words.error.replace("{reason}", error.message);
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>
