<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Pixels · 服务架构 / Architecture</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #fff;
        --surface2: #edf2f5;
        --ink: #172b36;
        --muted: #657782;
        --line: #dce5e9;
        --accent: #087e74;
        --accentSoft: #e5f5ef;
        --blue: #456cd7;
        --blueSoft: #ebf0ff;
        --amber: #a9680a;
        --amberSoft: #fff3da;
        --danger: #b94747;
        --shadow: 0 8px 30px #233f4a06;
        --radius: 20px;
      }
      :root[data-theme="dark"] {
        --bg: #101a20;
        --surface: #19262f;
        --surface2: #22333e;
        --ink: #e6eef2;
        --muted: #9aaeb9;
        --line: #344751;
        --accent: #63d4b9;
        --accentSoft: #203d38;
        --blue: #a0b6ff;
        --blueSoft: #29354e;
        --amber: #f1c575;
        --amberSoft: #403625;
        --danger: #ff9a9a;
        --shadow: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.65 "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      a,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }
      a {
        color: var(--accent);
        text-underline-offset: 4px;
      }
      button {
        border: 0;
      }
      svg {
        display: block;
      }
      [hidden] {
        display: none !important;
      }
      .shell {
        max-width: 1400px;
        margin: auto;
        padding: 0 40px;
      }
      .topbar {
        height: 83px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 750;
        font-size: 23px;
        letter-spacing: -0.8px;
      }
      .brandmark {
        width: 29px;
        height: 29px;
        display: grid;
        grid-template-columns: repeat(3, 7px);
        grid-template-rows: repeat(3, 7px);
        gap: 3px;
        transform: rotate(-5deg);
      }
      .brandmark i {
        background: var(--accent);
        border-radius: 2px;
      }
      .brandmark i:nth-child(3),
      .brandmark i:nth-child(8) {
        opacity: 0.35;
      }
      .brand small {
        font-size: 12px;
        letter-spacing: 1px;
        font-weight: 500;
        color: var(--muted);
        border-left: 1px solid var(--line);
        padding-left: 15px;
        margin-left: 6px;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .icon-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 38px;
        min-height: 38px;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }
      .icon {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.7;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
        margin-right: 12px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
        flex-shrink: 0;
      }
      .hero {
        padding: 35px 0 27px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 28px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 2.5px;
        font-weight: 750;
        text-transform: uppercase;
        margin: 0 0 10px;
      }
      h1 {
        font-size: clamp(27px, 3vw, 41px);
        line-height: 1.25;
        letter-spacing: -1.4px;
        margin: 0;
        font-weight: 720;
      }
      h1 span {
        color: var(--accent);
      }
      .hero p.description {
        margin: 13px 0 0;
        color: var(--muted);
        max-width: 690px;
        font-size: 14px;
      }
      .hero-note {
        border-left: 2px solid var(--line);
        padding-left: 20px;
        font-size: 12px;
        min-width: 174px;
        color: var(--muted);
      }
      .hero-note strong {
        display: block;
        font-size: 19px;
        color: var(--ink);
        font-weight: 650;
        margin-bottom: 2px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
        overflow: auto;
      }
      .tab {
        display: flex;
        gap: 8px;
        align-items: center;
        white-space: nowrap;
        padding: 13px 18px;
        background: none;
        border-bottom: 3px solid transparent;
        color: var(--muted);
        font-weight: 650;
      }
      .tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab-number {
        font: 11px monospace;
        opacity: 0.7;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 282px;
        gap: 20px;
      }
      .diagram-panel {
        min-width: 0;
        overflow: hidden;
      }
      .panel-bar {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .segmented {
        display: inline-flex;
        background: var(--surface2);
        border-radius: 11px;
        padding: 4px;
        gap: 3px;
      }
      .segmented button {
        background: transparent;
        border-radius: 8px;
        padding: 7px 13px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 650;
      }
      .segmented button.active {
        background: var(--surface);
        box-shadow: 0 2px 6px #00000008;
        color: var(--ink);
      }
      .small-label {
        font-size: 12px;
        color: var(--muted);
      }
      .platform-note {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        color: var(--muted);
        padding: 14px 24px 0;
        font-size: 12px;
      }
      .platform-note .icon {
        width: 16px;
        height: 16px;
        color: var(--accent);
        margin-top: 2px;
      }
      .map {
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-columns: 1fr 1.06fr 1fr;
        gap: 44px;
        padding: 24px 24px 68px;
        min-height: 458px;
      }
      .lane {
        min-width: 0;
        z-index: 1;
        pointer-events: none;
      }
      .lane > * {
        pointer-events: auto;
      }
      .lane-head {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.5px;
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        gap: 5px;
      }
      .lane-head span:first-child {
        font-weight: 650;
      }
      .lane-head span:last-child {
        font-family: monospace;
        opacity: 0.6;
      }
      .lane-left .node {
        margin-top: 126px;
      }
      .lane-right .node + .node {
        margin-top: 40px;
      }
      .lane-center .node + .node {
        margin-top: 22px;
      }
      .node {
        position: relative;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px;
        width: 100%;
        min-height: 88px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
      }
      .node:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .node.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accentSoft);
      }
      .node.flow-on {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blueSoft);
      }
      .node-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 4px;
      }
      .node-title strong {
        font-size: 14px;
        font-weight: 700;
      }
      .node-title .icon {
        color: var(--accent);
        width: 19px;
        height: 19px;
      }
      .node p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }
      .node small {
        display: block;
        margin-top: 7px;
        font-size: 10px;
        color: var(--muted);
      }
      .node.relay {
        background: var(--surface2);
      }
      .node.relay.in-use {
        background: var(--accentSoft);
        border-color: var(--accent);
      }
      .badge {
        display: inline-block;
        background: var(--accentSoft);
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        border-radius: 5px;
        padding: 1px 6px;
        margin-top: 7px;
      }
      .connections {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: visible;
        pointer-events: none;
      }
      .wire {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.6;
        stroke-dasharray: 5 5;
      }
      .wire.active {
        stroke: var(--blue);
        stroke-width: 2.5;
        stroke-dasharray: 6 5;
      }
      .wire.data {
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-dasharray: 0;
      }
      .wire.data.active {
        stroke-dasharray: 8 6;
        animation: travel 1.6s linear infinite;
      }
      @keyframes travel {
        to {
          stroke-dashoffset: -28;
        }
      }
      .route-caption {
        position: absolute;
        bottom: 17px;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--accent);
        font-size: 11px;
        z-index: 2;
        pointer-events: none;
      }
      .map-footer {
        border-top: 1px solid var(--line);
        padding: 13px 24px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 11px;
      }
      .legend {
        display: flex;
        gap: 16px;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 22px;
        border-top: 2px dashed var(--muted);
      }
      .legend i.data-key {
        border-top: 2px solid var(--accent);
      }
      .inspector {
        padding: 25px;
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      .inspector .big-icon {
        width: 43px;
        height: 43px;
        padding: 11px;
        background: var(--accentSoft);
        color: var(--accent);
        border-radius: 12px;
        margin: 20px 0 13px;
      }
      .inspector h2 {
        font-size: 22px;
        margin: 0 0 9px;
        letter-spacing: -0.6px;
      }
      .inspector p {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 18px;
      }
      .detail-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .detail-list li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 12px;
        margin: 12px 0;
      }
      .detail-list .icon {
        color: var(--accent);
        width: 15px;
        height: 15px;
        margin-top: 3px;
      }
      .boundary {
        margin-top: auto;
        padding: 15px 0 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .boundary strong {
        color: var(--ink);
        display: block;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      .fact {
        padding: 20px 22px;
      }
      .fact .index {
        color: var(--accent);
        font: 12px monospace;
      }
      .fact h3 {
        margin: 8px 0 5px;
        font-size: 14px;
      }
      .fact p {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
      }
      .flow-controls {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 17px;
      }
      .flow-controls p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .steps {
        list-style: none;
        margin: 18px 0;
        padding: 0;
      }
      .step-button {
        display: flex;
        text-align: left;
        gap: 10px;
        align-items: flex-start;
        width: 100%;
        padding: 11px 0;
        background: none;
        color: var(--muted);
      }
      .step-count {
        width: 23px;
        height: 23px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        font: 11px monospace;
      }
      .step-button.active {
        color: var(--ink);
        font-weight: 650;
      }
      .step-button.active .step-count {
        background: var(--blue);
        color: var(--surface);
        border-color: var(--blue);
      }
      .step-button small {
        display: block;
        font-size: 11px;
        font-weight: 400;
        margin-top: 3px;
      }
      .button-row {
        display: flex;
        gap: 9px;
        margin-top: 16px;
      }
      .primary,
      .secondary {
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 650;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .primary {
        background: var(--accent);
        color: var(--surface);
      }
      .secondary {
        background: var(--surface2);
        color: var(--ink);
      }
      .upgrade-intro {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 21px;
      }
      .upgrade-intro h2 {
        font-size: 24px;
        margin: 0;
        letter-spacing: -0.7px;
      }
      .upgrade-intro p {
        font-size: 13px;
        color: var(--muted);
        margin: 6px 0 0;
      }
      .upgrade-layout {
        display: grid;
        grid-template-columns: 1fr 310px;
        gap: 20px;
      }
      .simulation {
        padding: 26px;
      }
      .simulation-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .scenario-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .sim-stage {
        display: grid;
        grid-template-columns: 1fr 45px 1fr;
        gap: 18px;
        align-items: center;
        margin: 28px 0;
      }
      .server {
        padding: 25px 19px;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 16px;
        min-height: 179px;
      }
      .server.green {
        background: var(--accentSoft);
        border-color: var(--accent);
      }
      .server.amber {
        background: var(--amberSoft);
        border-color: var(--amber);
      }
      .server .icon {
        width: 27px;
        height: 27px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .server h3 {
        font-size: 15px;
        margin: 0;
      }
      .server p {
        color: var(--muted);
        font-size: 12px;
        margin: 7px 0 0;
      }
      .server-status {
        font-size: 11px;
        display: inline-block;
        padding: 3px 8px;
        background: var(--surface);
        border-radius: 6px;
        margin-top: 12px;
        color: var(--ink);
      }
      .sim-arrow {
        color: var(--muted);
        display: flex;
        justify-content: center;
      }
      .sim-arrow .icon {
        width: 26px;
        height: 26px;
      }
      .notice {
        padding: 15px 17px;
        background: var(--blueSoft);
        border-radius: 11px;
        color: var(--blue);
        font-size: 12px;
        min-height: 67px;
      }
      .notice.warning {
        background: var(--amberSoft);
        color: var(--amber);
      }
      .progress {
        display: flex;
        gap: 6px;
        margin: 24px 0 11px;
      }
      .progress span {
        height: 4px;
        border-radius: 3px;
        background: var(--line);
        flex: 1;
      }
      .progress span.done {
        background: var(--accent);
      }
      .sim-caption {
        font-size: 13px;
        font-weight: 650;
        min-height: 25px;
      }
      .upgrade-aside {
        padding: 25px;
      }
      .upgrade-aside h3 {
        font-size: 16px;
        margin: 0 0 14px;
      }
      .upgrade-aside p {
        font-size: 12px;
        color: var(--muted);
      }
      .pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 11px;
        color: var(--muted);
      }
      .capacity-control {
        margin: 17px 0;
        background: var(--surface2);
        padding: 15px;
        border-radius: 11px;
      }
      .capacity-control label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        gap: 10px;
      }
      .capacity-control input {
        width: 100%;
        accent-color: var(--accent);
        margin: 15px 0 3px;
      }
      .capacity-control small {
        font-size: 11px;
        color: var(--muted);
      }
      .ops-layout {
        display: grid;
        grid-template-columns: 185px minmax(0, 1fr);
        gap: 20px;
      }
      .ops-nav {
        padding: 14px;
        align-self: start;
      }
      .ops-nav-label {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: var(--muted);
        padding: 8px 10px 15px;
      }
      .ops-nav button {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 10px;
        margin: 3px 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
      }
      .ops-nav button.active {
        color: var(--accent);
        background: var(--accentSoft);
        font-weight: 700;
      }
      .ops-nav .icon {
        width: 17px;
        height: 17px;
      }
      .ops-content {
        min-width: 0;
      }
      .ops-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 16px;
      }
      .ops-header h2 {
        font-size: 24px;
        margin: 0;
        letter-spacing: -0.6px;
      }
      .ops-header p {
        font-size: 12px;
        color: var(--muted);
        margin: 5px 0;
      }
      .ops-toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin: 14px 0;
      }
      .ops-toolbar .segmented {
        flex-wrap: wrap;
      }
      .ops-stale {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        padding: 8px 12px;
        font-size: 12px;
      }
      .ops-stale[aria-pressed="true"] {
        color: var(--amber);
        background: var(--amberSoft);
        border-color: var(--amber);
      }
      .ops-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0;
      }
      .ops-metric {
        padding: 16px;
      }
      .ops-metric small {
        font-size: 11px;
        color: var(--muted);
      }
      .ops-metric strong {
        display: block;
        margin-top: 6px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.5px;
      }
      .ops-table-panel {
        overflow: hidden;
      }
      .ops-table-head {
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ops-table-head strong {
        font-size: 13px;
      }
      .ops-filter {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
      }
      .ops-filter input {
        accent-color: var(--accent);
      }
      .ops-scroll {
        overflow-x: auto;
      }
      .ops-table {
        width: 100%;
        min-width: 640px;
        border-collapse: collapse;
        font-size: 12px;
        text-align: left;
      }
      .ops-table th {
        padding: 11px 17px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        background: var(--surface2);
      }
      .ops-table td {
        padding: 15px 17px;

            `M${a} L${a[0]},${y - 12} Q${a[0]},${y} ${a[0] + 12},${y} L${z[0] - 12},${y} Q${z[0]},${y} ${z[0]},${y - 12} L${z}`,
          );
        }
        $("connections").setAttribute("viewBox", `0 0 ${bounds.width} ${bounds.height}`);
        $("connections").innerHTML = paths.join("");
      }
      function renderSimulation() {
        const rows = scenarios[state.lang][state.scenario],
          row = rows[state.simStep];
        $("userControl").hidden = state.scenario !== "node";
        $("users").value = String(state.users);
        $("users").disabled = state.simStep >= 2;
        $("userCount").textContent = `${state.users} / 4`;
        $("simIndex").textContent = `${t("simulationStep")} ${state.simStep + 1} / ${rows.length}`;
        ["A", "B"].forEach((side, i) => {
          const offset = i === 0 ? 1 : 4;
          const card = $("server" + side);
          card.innerHTML = `${icon(i === 0 ? "server" : state.scenario === "single" ? "monitor" : state.scenario === "node" ? "console" : "relay")}<h3>${text(row[offset])}</h3><p>${text(row[offset + 1])}</p><span class="server-status">${text(row[offset + 2])}</span>`;
          card.className = "server";
          if (
            (state.scenario === "single" && state.simStep === 2) ||
            (state.scenario === "node" && state.simStep === 2)
          )
            card.classList.add("amber");
          else if ((i === 1 && state.scenario === "redundant" && state.simStep >= 1) || state.simStep === 3)
            card.classList.add("green");
        });
        $("simNotice").textContent = row[7];
        $("simNotice").classList.toggle(
          "warning",
          state.scenario === "single" || (state.scenario === "node" && state.simStep === 1 && state.users > 0),
        );
        $("progress").innerHTML = rows
          .map((_, i) => `<span class="${i <= state.simStep ? "done" : ""}"></span>`)
          .join("");
        $("simCaption").textContent = row[0];
        const blocked = state.scenario === "node" && state.simStep === 1 && state.users > 0;
        $("simNext").disabled = blocked || state.simStep === 3;
        $("simNext").textContent = t(state.simStep === 3 ? "finish" : blocked ? "waiting" : "continue");
        const key = state.scenario;
        $("upgradeAside").innerHTML =
          `<p class="eyebrow">${text(t("simulationOnly"))}</p><h3>${text(t("coreRule"))}</h3><p>${text(t(key + "Rule"))}</p><h3>${text(t("userImpact"))}</h3><p>${text(t(key + "Impact"))}</p><div class="boundary"><strong>${text(t("scope"))}</strong>${text(t(key + "Scope"))}</div>${key === "single" || key === "node" ? `<div class="boundary">${text(t(key === "single" ? "graceNote" : "nodeGate"))}</div>` : ""}`;
      }
      function businessCandidates() {
        const profile = businessProfiles[state.businessApp];
        const pending = [...state.businessReservations];
        if (state.businessScenario === "reserved")
          pending.push({ host: "machine-a", gpu: "a-g1", app: "game", profile: businessProfiles.game });
        const result = [];
        for (const host of businessHosts) {
          if (state.businessMachine !== "auto" && host.id !== state.businessMachine) continue;
          const hostPending = pending.filter((item) => item.host === host.id);
          const sum = (items, key) => items.reduce((total, item) => total + item.profile[key], 0);
          const fresh = host.fresh && state.businessScenario !== "stale";
          const baseCpu = state.businessScenario === "cpu" && host.id === "machine-a" ? 76 : host.cpu;
          const baseRam = state.businessScenario === "full" ? 64 : host.ram;
          const cpu = baseCpu + sum(hostPending, "cpu") + profile.cpu;
          const ram = baseRam + sum(hostPending, "ram") + profile.ram;
          const net = host.net + sum(hostPending, "net") + profile.net;
          const hostReasons = [];
          if (!fresh) hostReasons.push("stale");
          if (state.businessScenario === "drain" && host.id === "machine-a") hostReasons.push("drain");
          if (cpu > 80) hostReasons.push("cpu");
          if (ram > 64) hostReasons.push("ram");
          if (net > 100) hostReasons.push("net");
          if (state.businessApp === "rdp") {
            if (host.id !== "machine-b") hostReasons.push("affinity");
            if (pending.some((item) => item.app === "rdp")) hostReasons.push("busy");
          } else if (!host.apps.includes(state.businessApp)) hostReasons.push("deployment");
          const gpus =
            state.businessApp === "rdp"
              ? [{ id: "workspace-01", label: "", gpu: 0, vram: 0, enc: 0, slots: 0 }]
              : host.gpus;
          for (const gpu of gpus) {
            const gpuPending = hostPending.filter((item) => item.gpu === gpu.id);
            const graphics = gpu.gpu + sum(gpuPending, "gpu") + profile.gpu;
            const vram = gpu.vram + sum(gpuPending, "vram") + profile.vram;
            const enc = gpu.enc + sum(gpuPending, "enc") + profile.enc;
            const reasons = [...hostReasons];
            if (state.businessApp !== "rdp") {
              if (graphics > 85) reasons.push("gpu");
              if (vram > 20) reasons.push("vram");
              if (enc > 2) reasons.push("enc");
              if (
                (profile.exclusive && gpu.slots + gpuPending.length > 0) ||
                gpuPending.some((item) => item.profile.exclusive)
              )
                reasons.push("exclusive");
              if (gpu.slots + gpuPending.length + 1 > 3) reasons.push("slots");
            }
            const ratios = [
              cpu / 80,
              ram / 64,
              net / 100,
              ...(state.businessApp === "rdp" ? [] : [graphics / 85, vram / 20, enc / 2]),
            ];
            result.push({
              host: host.id,
              gpu: gpu.id,
              label: gpu.label,
              fresh,
              cpu,
              ram,
              net,
              graphics,
              vram,
              enc,
              running: gpu.slots,
              pending: gpuPending.length,
              reasons,
              score: Math.max(...ratios),
              average: ratios.reduce((a, b) => a + b, 0) / ratios.length,
            });
          }
        }
        return result.sort(
          (a, b) =>
            Number(a.reasons.length > 0) - Number(b.reasons.length > 0) ||
            a.score - b.score ||
            a.average - b.average ||
            a.gpu.localeCompare(b.gpu),
        );
      }
      function renderBusiness() {
        const copy = t("business");
        const candidates = businessCandidates();
        const best = candidates.find((row) => !row.reasons.length);
        const isRdp = state.businessApp === "rdp";
        const option = (value, label, current) =>
          `<option value="${value}" ${value === current ? "selected" : ""}>${text(label)}</option>`;
        const list = (items) => `<ul>${items.map((item) => `<li>${text(item)}</li>`).join("")}</ul>`;
        const number = (row, value) => (row.fresh ? text(value) : text(copy.unknown));
        $("business").innerHTML = `
          <div class="platform-note">${text(copy.prototype)}</div>
          <h2>${text(copy.title)}</h2><p>${text(copy.intro)}</p>
          <div class="business-grid">${Object.entries(copy.apps)
            .map(
              ([key, app]) =>
                `<button class="panel business-card ${key === state.businessApp ? "active" : ""}" data-business-app="${key}" aria-pressed="${key === state.businessApp}"><strong>${text(app[0])}</strong><small>${text(app[1])}</small><small>${text(app[2])}</small></button>`,
            )
            .join("")}</div>
          <div class="panel business-result">${list(copy.ownership)}</div>
          <div class="business-controls">
            <label>${text(copy.scenario)}<select id="businessScenario">${Object.entries(copy.scenarios)
              .map(([key, value]) => option(key, value, state.businessScenario))
              .join("")}</select></label>
            <label>${text(copy.machine)}<select id="businessMachine">${option("auto", copy.auto, state.businessMachine)}${businessHosts.map((host) => option(host.id, host.id, state.businessMachine)).join("")}</select></label>
            <label>${text(copy.role)}<select id="businessRole">${["operator", "viewer"].map((role) => option(role, copy[role], state.businessRole)).join("")}</select></label>
          </div>
          <div class="panel business-result" id="businessResult" aria-live="polite">
            <small>${text(copy.result)}</small><h3 id="businessRecommendation">${best ? `${text(best.host)} / ${text(isRdp ? "workspace-01" : best.label)}` : text(copy.none)}</h3>
            <p>${best ? (isRdp ? text(copy.workspace) : `${text(copy.score)}: ${Math.round(best.score * 100)}% · ${text(copy.formula)}`) : text(copy.noneDetail)}</p>
            <button class="primary" id="businessReserve" ${!best || state.businessRole === "viewer" ? "disabled" : ""}>${text(copy.reserve)}</button>
            <button class="secondary" id="businessReset">${text(copy.reset)}</button>
            <p>${text(copy.pending)}: <strong id="businessReservationCount">${state.businessReservations.length}</strong>${state.businessLast ? ` · ${text(copy.reserved)}: ${text(state.businessLast)}` : ""}</p>
            <p>${text(state.businessRole === "viewer" ? copy.readonly : copy.notLaunched)}</p>
          </div>
          <h3>${text(copy.table)}</h3><p>${text(copy.scroll)}</p>
          <div class="panel ops-scroll"><table class="ops-table business-table" aria-label="${text(copy.table)}"><thead><tr>${copy.columns.map((col) => `<th scope="col">${text(col)}</th>`).join("")}</tr></thead><tbody>${candidates
            .map(
              (
                row,
              ) => `<tr data-candidate="${row.host}/${row.gpu}" data-eligible="${row.reasons.length === 0}" class="${row === best ? "selected" : ""}">
            <td><strong>${text(row.host)}</strong><small>${text(isRdp ? copy.osGpu : row.label)}</small><small>${text(row.gpu)}</small></td>
            <td>${number(row, `${row.cpu}/80 · ${row.ram}/64 · ${row.net}/100`)}<small>${text(copy.hostUsage)}</small></td>
            <td>${isRdp ? "—" : number(row, `${row.graphics}/85`)}<small>${text(isRdp ? copy.osGpu : copy.gpuUsage)}</small></td>
            <td>${isRdp ? "—" : number(row, `${row.vram}/20 GiB · ${row.enc}/2`)}<small>${text(copy.vram)} / ${text(copy.enc)}</small></td>
            <td>${isRdp ? "—" : number(row, `${row.running} / ${row.pending}`)}<small>${text(copy.slots)}</small></td>
            <td><span class="ops-badge ${row.reasons.length ? "unknown" : ""}">${text(row === best ? copy.chosen : row.reasons.length ? copy.rejected : copy.eligible)}</span><small>${row.reasons.length ? row.reasons.map((reason) => text(copy.reasons[reason])).join(" · ") : `${text(copy.score)} ${Math.round(row.score * 100)}%`}</small></td>
          </tr>`,
            )
            .join("")}</tbody></table></div><p>${text(copy.units)}</p>
          <div class="business-details"><div class="panel"><h3>${text(copy.fieldsTitle)}</h3>${list(copy.fields)}</div><div class="panel"><h3>${text(copy.safetyTitle)}</h3>${list(copy.safety)}</div></div>`;
      }
      function renderOperations() {
        if (state.deploy === "private" && state.opsPage === "auth") {
          state.opsPage = "overview";
          state.opsPreview = false;
        }
        const copy = t("ops"),
          page = copy.pages[state.opsPage];
        const navIcons = {
          overview: "console",
          console: "console",
          auth: "lock",
          desk: "console",
          broker: "broker",
          relay: "relay",
          node: "server",
          render: "render",
          rdp: "monitor",
          maintenance: "lock",
        };
        $("opsPrototype").textContent = copy.prototype;
        $("opsNav").setAttribute("aria-label", copy.navigation);
        $("opsNav").innerHTML = `<div class="ops-nav-label">${text(copy.navigation)}</div>${Object.entries(copy.pages)
          .filter(([id]) => id !== "auth" || state.deploy === "official")
          .map(
            ([id, p]) =>
              `<button data-ops-page="${id}" class="${state.opsPage === id ? "active" : ""}" aria-pressed="${state.opsPage === id}">${icon(navIcons[id])}<span>${text(p.title)}</span></button>`,
          )
          .join("")}`;
        $("opsEyebrow").textContent = copy.eyebrow;
        $("opsTitle").textContent = page.title;
        $("opsSubtitle").textContent = page.desc;
        $("opsMode").textContent = copy.mode;
        document.querySelectorAll("[data-role]").forEach((button) => {
          button.textContent = copy[button.dataset.role];
        });
        activate("[data-role]", "role", state.opsRole);
        $("opsStale").textContent = copy.staleToggle;
        $("opsStale").setAttribute("aria-pressed", String(state.opsStale));
        $("opsFreshness").textContent = state.opsStale ? copy.stale : copy.fresh;
        $("opsMetrics").innerHTML = [...page.metrics, [copy.freshLabel, state.opsStale ? "15 min" : "2 s"]]
          .map(
            ([label, value], i) =>
              `<div class="panel ops-metric"><small>${text(label)}</small><strong>${text(state.opsStale && i < 3 ? "—" : value)}</strong></div>`,
          )
          .join("");
        $("opsListTitle").textContent = state.opsPage === "maintenance" ? copy.tasks : copy.list;
        $("opsFilterLabel").textContent = copy.filter;
        $("opsFilter").checked = state.opsFilter;
        const rows = opsInventory
          .filter((row) => page.ids.includes(row.id))
          .filter(
            (row) =>
              !state.opsFilter ||
              state.opsStale ||
              !["healthy", "completed"].includes(row.health) ||
              row.admission === "closed",
          );
        if (!rows.some((row) => row.id === state.opsSelected)) state.opsSelected = rows[0]?.id ?? "";
        const selected = rows.find((row) => row.id === state.opsSelected);
        const badge = (row) => {
          const status = state.opsStale ? "unknown" : row.health;
          return `<span class="ops-badge ${status === "unknown" ? "unknown" : !["healthy", "completed"].includes(status) ? "amber" : ""}">${text(copy.states[status])}</span>`;
        };
        const admission = (row) =>
          state.opsStale || row.health === "unknown" ? copy.unknown : copy.modes[row.admission];
        const columns = state.opsPage === "maintenance" ? copy.taskColumns : copy.columns;
        $("opsTable").innerHTML = rows.length
          ? `<table class="ops-table" aria-label="${text(page.title)}"><thead><tr>${columns.map((c) => `<th scope="col">${text(c)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr class="${row.id === state.opsSelected ? "selected" : ""}"><td><button class="ops-row-button" data-ops-row="${row.id}" aria-pressed="${row.id === state.opsSelected}">${text(row.id)}</button></td><td>${text(row.host)}</td><td>${badge(row)}</td><td>${text(admission(row))}</td><td>${text(row.version)}</td><td>${state.opsStale ? "—" : text(copy.loads[row.load])}</td></tr>`).join("")}</tbody></table>`
          : `<div class="ops-empty">${text(copy.empty)}</div>`;
        const fields = page.fields.map((field) => `<li>${text(field)}</li>`).join("");
        $("opsDetail").innerHTML =
          `<h3>${text(copy.detail)}</h3>${selected ? `<dl class="ops-kv"><dt>${text(copy.object)}</dt><dd>${text(selected.id)}</dd><dt>${text(copy.host)}</dt><dd>${text(selected.host)}</dd><dt>${text(copy.health)}</dt><dd>${badge(selected)}</dd><dt>${text(copy.admission)}</dt><dd>${text(admission(selected))}</dd><dt>${text(state.opsStale || selected.health === "unknown" ? copy.lastKnown : copy.load)}</dt><dd>${text(copy.loads[selected.load])}</dd></dl>` : `<p>${text(copy.choose)}</p>`}<div class="boundary"><strong>${text(copy.fields)}</strong><ul>${fields}</ul></div>`;
        const blocked = state.opsStale || state.opsRole === "viewer" || !selected || selected.health === "unknown";
        const note =
          state.opsRole === "viewer"
            ? copy.readonly
            : state.opsStale || selected?.health === "unknown"
              ? copy.blocked
              : !selected
                ? copy.choose
                : copy.available;
        $("opsActions").innerHTML =
          `<h3>${text(copy.actions)}</h3><ul>${page.actions.map((action) => `<li>${text(action)}</li>`).join("")}</ul><div class="boundary"><strong>${text(t("boundaryLabel"))}</strong>${text(page.boundary)}</div><p class="ops-action-note">${text(note)}</p><button class="primary" id="opsPreviewButton" ${blocked ? "disabled" : ""}>${text(copy.preview)}</button>`;
        if (blocked) state.opsPreview = false;
        $("opsPreflight").hidden = !state.opsPreview;
        $("opsPreflight").innerHTML =
          `<strong>${text(copy.preflightTitle)}</strong><p>${text(copy.selected)}: ${text(state.opsSelected)}</p><ol>${copy.preflight.map((line) => `<li>${text(line)}</li>`).join("")}</ol>`;
        $("opsCaption").textContent = copy.caption;
      }
      function revealActiveTab() {
        const nav = document.querySelector(".tabs");
        const active = nav.querySelector('[aria-pressed="true"]');
        if (!active) return;
        const item = active.getBoundingClientRect();
        const viewport = nav.getBoundingClientRect();
        if (item.right > viewport.right) nav.scrollLeft += item.right - viewport.right;
        else if (item.left < viewport.left) nav.scrollLeft -= viewport.left - item.left;
      }
      function render() {
        document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-t]").forEach((el) => {
          el.textContent = t(el.dataset.t);
        });
        document.querySelectorAll("[data-label]").forEach((el) => {
          el.setAttribute("aria-label", t(el.dataset.label));
        });
        $("language").textContent = state.lang === "zh" ? "EN" : "中文";
        $("architecture").hidden = !["overview", "connection"].includes(state.view);
        $("upgrades").hidden = state.view !== "upgrade";
        $("operations").hidden = state.view !== "operations";
        $("business").hidden = state.view !== "business";
        $("flowControls").hidden = state.view !== "connection";
        activate("[data-view]", "view", state.view);
        activate("[data-deploy]", "deploy", state.deploy);
        activate("[data-path]", "path", state.path);
        activate("[data-scenario]", "scenario", state.scenario);
        $("platformNote").textContent = t(state.deploy === "official" ? "officialNote" : "privateNote");
        const route = t("route" + (state.path === "relay" ? "Relay" : state.path === "rdp" ? "Rdp" : "Direct"));
        $("routeCaption").textContent = route;
        $("mobileRoute").textContent = route;
        renderNodes();
        renderInspector();
        facts("facts", "facts");
        facts("upgradeFacts", "upgradeFacts");
        renderSimulation();
        renderOperations();
        renderBusiness();
        requestAnimationFrame(drawConnections);
        requestAnimationFrame(revealActiveTab);
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        if (button.dataset.view) {
          state.view = button.dataset.view;
          if (state.view === "overview") state.path = "direct";
        } else if (button.dataset.deploy) state.deploy = button.dataset.deploy;
        else if (button.dataset.path) {
          state.path = button.dataset.path;
          state.step = 0;
        } else if (button.dataset.node) {
          state.selected = button.dataset.node;
          state.view = "overview";
        } else if (button.dataset.step !== undefined) state.step = Number(button.dataset.step);
        else if (button.dataset.scenario) {
          state.scenario = button.dataset.scenario;
          state.simStep = 0;
          state.users = 2;
        } else if (button.dataset.businessApp) {
          state.businessApp = button.dataset.businessApp;
        } else if (button.id === "businessReserve") {
          const best = businessCandidates().find((row) => !row.reasons.length);
          if (best && state.businessRole === "operator") {
            state.businessReservations.push({
              host: best.host,
              gpu: best.gpu,
              app: state.businessApp,
              profile: { ...businessProfiles[state.businessApp] },
            });
            state.businessLast = `${best.host} / ${best.gpu}`;
          }
        } else if (button.id === "businessReset") {
          state.businessReservations = [];
          state.businessLast = "";
        } else if (button.dataset.opsPage) {
          state.opsPage = button.dataset.opsPage;
          state.opsSelected = "";
          state.opsPreview = false;
        } else if (button.dataset.opsRow) {
          state.opsSelected = button.dataset.opsRow;
          state.opsPreview = false;
        } else if (button.dataset.role) {
          state.opsRole = button.dataset.role;
          state.opsPreview = false;
        } else if (button.id === "opsStale") {
          state.opsStale = !state.opsStale;
          state.opsPreview = false;
        } else if (button.id === "opsPreviewButton") {
          if (state.opsRole === "operator" && !state.opsStale) state.opsPreview = !state.opsPreview;
        } else if (button.id === "flowNext") state.step = (state.step + 1) % 4;
        else if (button.id === "language") state.lang = state.lang === "zh" ? "en" : "zh";
        else if (button.id === "theme") {
          document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          try {
            localStorage.setItem("pixels-architecture-theme", document.documentElement.dataset.theme);
          } catch {}
        } else if (button.id === "simNext") {
          if (!(state.scenario === "node" && state.simStep === 1 && state.users > 0))
            state.simStep = Math.min(3, state.simStep + 1);
        } else if (button.id === "simReset") {
          state.simStep = 0;
          state.users = 2;
        } else return;
        render();
        if (button.id === "flowNext") $("flowNext").focus();
        if (button.dataset.opsPage) document.querySelector(`[data-ops-page="${button.dataset.opsPage}"]`).focus();
        if (button.dataset.opsRow) document.querySelector(`[data-ops-row="${button.dataset.opsRow}"]`)?.focus();
        if (button.id === "opsPreviewButton") $("opsPreviewButton").focus();
        if (button.dataset.businessApp)
          document.querySelector(`[data-business-app="${button.dataset.businessApp}"]`).focus();
        if (button.id === "businessReserve" || button.id === "businessReset") $(button.id).focus();
      });
      document.addEventListener("change", (event) => {
        const fields = {
          businessScenario: "businessScenario",
          businessMachine: "businessMachine",
          businessRole: "businessRole",
        };
        const field = fields[event.target.id];
        if (!field) return;
        state[field] = event.target.value;
        if (field === "businessScenario") {
          state.businessReservations = [];
          state.businessLast = "";
        }
        renderBusiness();
        $(event.target.id).focus();
      });
      $("opsFilter").addEventListener("change", (event) => {
        state.opsFilter = event.target.checked;
        state.opsPreview = false;
        renderOperations();
      });
      $("users").addEventListener("input", (event) => {
        state.users = Number(event.target.value);
        renderSimulation();
      });
      try {
        const saved = localStorage.getItem("pixels-architecture-theme");
        if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
      } catch {}
      new ResizeObserver(() => requestAnimationFrame(drawConnections)).observe($("map"));
      new ResizeObserver(() => requestAnimationFrame(revealActiveTab)).observe(document.querySelector(".tabs"));
      render();
    </script>
  </body>
</html>
