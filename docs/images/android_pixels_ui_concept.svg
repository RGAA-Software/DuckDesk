<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Pixels Android UI concept</title>
  <desc id="description">Dark Pixels device home and landscape remote workspace concept.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1427"/>
      <stop offset="1" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="remote" x1="500" y1="140" x2="1360" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243D6B"/>
      <stop offset="0.48" stop-color="#172A49"/>
      <stop offset="1" stop-color="#0B1427"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A4AEFF"/>
      <stop offset="1" stop-color="#6577FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#page)"/>
  <text x="64" y="48" fill="#F5F7FF" font-family="sans-serif" font-size="24" font-weight="700">Pixels Android · Design Baseline 1.0</text>

  <!-- Phone device home -->
  <g filter="url(#shadow)">
    <rect x="64" y="78" width="350" height="760" rx="42" fill="#080C18" stroke="#2A3653" stroke-width="2"/>
    <rect x="192" y="92" width="94" height="7" rx="3.5" fill="#2A3653"/>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <g transform="translate(92 125)">
      <rect width="34" height="34" rx="9" fill="#8492FF"/>
      <path d="M9 8h13v4H13v4h9v4h-9v7H9z" fill="#07101F"/>
      <rect x="24" y="22" width="4" height="4" rx="1" fill="#35D8B5"/>
    </g>
    <text x="137" y="151" fill="#F5F7FF" font-size="22" font-weight="700">Pixels</text>
    <circle cx="382" cy="142" r="17" fill="#17213A"/>
    <circle cx="382" cy="139" r="5" fill="#AAB5CE"/>
    <path d="M373 152c2-7 16-7 18 0" fill="none" stroke="#AAB5CE" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="88" y="184" width="302" height="140" rx="22" fill="#17213A" stroke="#2A3653"/>
    <text x="110" y="216" fill="#F5F7FF" font-size="16" font-weight="700">快速连接</text>
    <rect x="108" y="233" width="260" height="44" rx="12" fill="#10172A" stroke="#2A3653"/>
    <text x="124" y="260" fill="#AAB5CE" font-size="13">设备代码、IP 或连接信息</text>
    <rect x="257" y="286" width="111" height="30" rx="10" fill="url(#primary)"/>
    <text x="296" y="307" fill="#07101F" font-size="13" font-weight="700">连接</text>
    <text x="110" y="307" fill="#8492FF" font-size="13" font-weight="600">粘贴</text>
    <text x="166" y="307" fill="#8492FF" font-size="13" font-weight="600">扫码</text>

    <text x="92" y="367" fill="#F5F7FF" font-size="18" font-weight="700">我的设备</text>
    <text x="344" y="367" fill="#8492FF" font-size="14" font-weight="600">+ 添加</text>

    <rect x="88" y="387" width="302" height="142" rx="18" fill="#10172A" stroke="#2A3653"/>
    <circle cx="112" cy="414" r="5" fill="#35D8B5"/>
    <text x="126" y="420" fill="#F5F7FF" font-size="16" font-weight="700">工作电脑</text>
    <text x="108" y="449" fill="#AAB5CE" font-size="13">Windows 11 · 在线 · 12 ms</text>
    <rect x="108" y="469" width="118" height="42" rx="12" fill="#8492FF"/>
    <text x="133" y="495" fill="#07101F" font-size="14" font-weight="700">远程桌面</text>
    <rect x="238" y="469" width="60" height="42" rx="12" fill="#17213A"/>
    <text x="255" y="495" fill="#F5F7FF" font-size="13">文件</text>
    <rect x="306" y="469" width="60" height="42" rx="12" fill="#17213A"/>
    <text x="323" y="495" fill="#F5F7FF" font-size="13">应用</text>

    <rect x="88" y="545" width="302" height="104" rx="18" fill="#10172A" stroke="#2A3653"/>
    <circle cx="112" cy="574" r="5" fill="#59647A"/>
    <text x="126" y="580" fill="#F5F7FF" font-size="16" font-weight="700">家中电脑</text>
    <text x="108" y="609" fill="#AAB5CE" font-size="13">离线 · 上次连接 2 小时前</text>
    <text x="108" y="634" fill="#8492FF" font-size="13" font-weight="600">查看详情</text>

    <rect x="80" y="755" width="318" height="62" rx="24" fill="#10172A" stroke="#2A3653"/>
    <circle cx="135" cy="779" r="5" fill="#8492FF"/>
    <text x="119" y="802" fill="#F5F7FF" font-size="12" font-weight="600">设备</text>
    <circle cx="239" cy="779" r="5" fill="#59647A"/>
    <text x="223" y="802" fill="#AAB5CE" font-size="12">传输</text>
    <circle cx="343" cy="779" r="5" fill="#59647A"/>
    <text x="327" y="802" fill="#AAB5CE" font-size="12">设置</text>
  </g>

  <!-- Landscape remote workspace -->
  <g filter="url(#shadow)">
    <rect x="486" y="112" width="890" height="500" rx="34" fill="#080C18" stroke="#2A3653" stroke-width="2"/>
    <rect x="504" y="130" width="854" height="464" rx="22" fill="url(#remote)"/>
  </g>
  <g opacity="0.22" stroke="#8492FF" fill="none">
    <path d="M560 470L760 278l134 105 172-180 245 242" stroke-width="4"/>
    <circle cx="760" cy="278" r="74" stroke-width="2"/>
    <circle cx="1100" cy="275" r="120" stroke-width="2"/>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="526" y="151" width="180" height="36" rx="18" fill="#10172AE6" stroke="#2A3653"/>
    <circle cx="548" cy="169" r="5" fill="#35D8B5"/>
    <text x="560" y="174" fill="#F5F7FF" font-size="13" font-weight="600">工作电脑 · 18 ms</text>
    <rect x="1245" y="151" width="91" height="36" rx="18" fill="#2B1320E6" stroke="#FF7085"/>
    <circle cx="1267" cy="169" r="5" fill="#FF7085"/>
    <text x="1280" y="174" fill="#FFDDE3" font-size="12" font-weight="700">00:12</text>
    <text x="833" y="335" fill="#F5F7FF" font-size="28" font-weight="700" opacity="0.86">Remote Canvas</text>
    <text x="860" y="363" fill="#AAB5CE" font-size="14">画面优先 · 工具渐进展开</text>

    <rect x="713" y="511" width="440" height="64" rx="24" fill="#10172AEB" stroke="#2A3653"/>
    <rect x="727" y="521" width="84" height="44" rx="14" fill="#273252"/>
    <text x="746" y="548" fill="#F5F7FF" font-size="13" font-weight="700">触控板</text>
    <text x="839" y="548" fill="#F5F7FF" font-size="13">键盘</text>
    <text x="913" y="548" fill="#F5F7FF" font-size="13">显示</text>
    <text x="987" y="548" fill="#F5F7FF" font-size="13">工具</text>
    <rect x="1064" y="521" width="74" height="44" rx="14" fill="#351923"/>
    <text x="1087" y="548" fill="#FF8DA0" font-size="13" font-weight="700">结束</text>

    <text x="488" y="664" fill="#F5F7FF" font-size="20" font-weight="700">会话工具面板</text>
    <text x="488" y="690" fill="#AAB5CE" font-size="14">高频动作一次点击到达，持续状态不会被 Toast 丢失。</text>
    <rect x="488" y="720" width="888" height="118" rx="24" fill="#10172A" stroke="#2A3653"/>
    <g font-size="13" font-weight="600" text-anchor="middle">
      <g transform="translate(548 744)"><circle cx="0" cy="18" r="20" fill="#273252"/><text y="56" fill="#F5F7FF">输入模式</text></g>
      <g transform="translate(688 744)"><circle cx="0" cy="18" r="20" fill="#273252"/><text y="56" fill="#F5F7FF">多显示器</text></g>
      <g transform="translate(828 744)"><circle cx="0" cy="18" r="20" fill="#273252"/><text y="56" fill="#F5F7FF">声音</text></g>
      <g transform="translate(968 744)"><circle cx="0" cy="18" r="20" fill="#273252"/><text y="56" fill="#F5F7FF">文件</text></g>
      <g transform="translate(1108 744)"><circle cx="0" cy="18" r="20" fill="#273252"/><text y="56" fill="#F5F7FF">录制</text></g>
      <g transform="translate(1248 744)"><circle cx="0" cy="18" r="20" fill="#183B35"/><text y="56" fill="#F5F7FF">语音</text></g>
    </g>
  </g>
</svg>
