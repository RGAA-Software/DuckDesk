[package]
name = "gr_base"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "std"] }
tracing-appender = "^0"
tracing-log = "0.2.0"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
base64 = "0.22.1"
rand = "0.9.2"
aes-gcm = "0.10.1"
sled = "0.34.7"
raw-cpuid = "11"
disk-serial-number = "0.2.1"
csv = "1.4.0"
mail-send = "0.5.2"
tokio-test = "*"
chrono = { version = "0.4", features = ["serde"] }
netdev = "0.39.0"
local-ip-address = "0.6.10"
redis = { version = "0.32.5", features = ["tokio-comp", "r2d2", "tokio-rustls-comp", "connection-manager"] }
mongodb = "3.2.1"
