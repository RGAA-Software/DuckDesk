[package]
name = "px_sysinfo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "GammaRaySysInfo"
path = "src/main.rs"

[[bin]]
name = "GrSysMonitor"
path = "src/bin/px_sys_monitor.rs"

[[bin]]
name = "GrSysMonitorHost"
path = "src/bin/px_sys_monitor_host.rs"

[features]
default = []
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3.3", optional = true }
px_base = {path = "../../rust_base/px_base"}
px_auth_mgr = {path = "../../rust_base/px_auth_mgr" }

serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37.0"
tokio = { version = "1.43.0", features = ["full"] }
lazy_static = "1.5.0"
nvml-wrapper = "0.11.0"
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots", "tokio-rustls"] }
futures-util = "0.3.31"
clap = { version = "4.5.47", features = ["derive"] }
clap_derive = "4.5.47"
calcmhz = "0.1.10"
adlx = { git = "https://github.com/Traverse-Research/adlx-rs.git", branch = "main" }
anyhow = "1.0.100"
netdev = "0.37.3"
tracing = "0.1.44"
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
smol = "2.0.2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
