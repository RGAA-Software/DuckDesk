[package]
name = "px_service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "px_service"
path = "src/main.rs"

[dependencies]
px_base = { path = "../../rust_base/px_base" }
px_node_protocol = { path = "../../rust_server/px_node_protocol" }
protocol = { path = "../../rust_base/protocol" }
service_core = { path = "./service_core" }
prost = "0.14.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots", "tokio-rustls"] }
futures-util = "0.3.31"
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wmi = "0.17.3"
nvml-wrapper = "0.11.0"
winapi = { version = "0.3", features = [
    "fileapi",
    "handleapi",
    "ioapiset",
    "setupapi",
    "wingdi",
    "winuser",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
] }
tracing = "0.1.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
