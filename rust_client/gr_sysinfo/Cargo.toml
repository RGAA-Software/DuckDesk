[package]
name = "gr_sysinfo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "GammaRaySysInfo"
path = "src/main.rs"

[dependencies]
gr_base = {path = "../../rust_base/gr_base"}
gr_auth_mgr = {path = "../gr_auth_mgr" }

serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37.0"
tokio = { version = "1.43.0", features = ["full"] }
lazy_static = "1.5.0"
nvml-wrapper = "0.11.0"
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots", "tokio-rustls"] }
futures-util = "0.3.31"
clap = { version = "4.5.47", features = ["derive"] }
clap_derive = "4.5.47"
calcmhz = "0.1.10"
adlx = { git = "https://github.com/Traverse-Research/adlx-rs.git", branch = "main" }
anyhow = "1.0.100"
netdev = "0.37.3"
tracing = "0.1.44"
