[workspace]
members = ["px_transport", "px_transport_ffi", "px_transport_probe"]
resolver = "3"

[patch.crates-io]
iroh = { path = "vendor/iroh-1.3.0" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
bytes = "1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
noq-proto = { version = "=1.3.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "signal"] }

# Focused development uses Release semantics with inexpensive optimization.
[profile.release]
opt-level = 1
debug = 0
incremental = true
codegen-units = 16

[profile.publication]
inherits = "release"
opt-level = 3
incremental = false
lto = "thin"
codegen-units = 1
