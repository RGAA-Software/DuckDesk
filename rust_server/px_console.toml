# name
server_name = "Srv.01"

# 此机器的IP, 如不修改则使用默认
# The ip of the machine, use default if it's empty.
server_w3c_ip = ""

# 需要对外开放的端口
# Console/Manager port
# TCP
console_port = 30500

# 需要对外开放的端口
# UDP
# DO NOT MODIFY
udp_broadcast_port = 30501

# 需要对外开放的端口
# Relay Port
relay_port = 30502

# mongodb装在本机，则不需要修改
# mongodb url
environment = "test"
mongodb_url = "mongodb://localhost:27017/"

# redis装在本机，则不需要修改
# redis url address
redis_url = "redis://127.0.0.1:6379/"

## cert.pem
ssl_cert = "certs/cert.pem"

## key.pem
ssl_key = "certs/key.pem"

# Console is the only public TLS endpoint. Panel, Windows clients and the
# Windows service connect to this port with HTTPS/WSS. Render and local IPC
# keep their existing HTTP/WS transports.
ssl_enable = true
privacy_hash_salt = "local-test-only-privacy-salt"

# 授权服务器地址（px_auth_server）
auth_server_url = "https://127.0.0.1:30400"

# 授权拉取周期（秒）
auth_pull_interval_secs = 3600

# 接入凭据（与 auth server 的 [app_credential] 段一致）
# 为空则 pull 请求不携带签名头（兼容 auth server require_app_credential=false）
# force_authorize: true = enforce WS token / HTTP appkey auth;
# false = bypass all auth checks (local/testing). Default when missing: true.
force_authorize = false

[app_credential]
appkey = ""
app_secret = ""

# ZLMediaKit is normally deployed beside Console. The API secret stays in this
# server-only file: the browser receives a short-lived Console playback ticket,
# never a direct ZLM API credential.
[live]
# ZLM HTTP/API address reachable from px_console. For the local sidecar deployment,
# change this URL (for example http://127.0.0.1:18080) to change the ZLM HTTP
# port; Console synchronizes the adjacent px_media/config.ini at startup.
# When ZLM is remote, use its private/LAN address instead.
media_server_url = "http://127.0.0.1:12888"
# Address render instances use to publish the passive main stream. For a
# remote ZLMediaKit set this to its LAN/public RTMP address instead.
publish_rtmp_url = "rtmp://127.0.0.1:1935/live/{live_stream_id}"
# Copy the [api] secret from px_media/config.ini for a non-loopback ZLM.
# Keep this empty only for a local 127.0.0.1 test deployment.
api_secret = ""
# RTMP publish app. Render uses stream_id: <device_id>__app__<app_id>.
app = "live"
default_app_id = "cargame_debug"
# Start px_media.exe automatically only when media_server_url points to this
# machine. Set false when the local sidecar is managed by Windows Service.
auto_start_media_server = true

[user]
panel_sliding_days = 30
panel_absolute_days = 90
web_sliding_hours = 12
web_absolute_days = 30
admin_sliding_hours = 2
admin_absolute_hours = 8
guest_absolute_hours = 24
ticket_expire_seconds = 30
# Rotating browser reconnect capability absolute lifetime (default 24h).
ticket_renew_expire_seconds = 86400

[user.rate_limit]
login_per_ip_per_minute = 10
login_per_account_per_15_minutes = 20
guest_session_per_ip_per_hour = 30
start_per_subject_per_minute = 6

[user.quota]
guest_concurrent_instances = 1
user_concurrent_instances = 3
guest_daily_minutes = 60
public_app_global_concurrency = 20

# Standard WebRTC and the managed Coturn sidecar. During the initial TURN
# integration test phase direct probing remains disabled so Panel always enters
# net_rtc. Restore this to true only after the standard RTC acceptance gate.
[rtc]
direct_probe_enabled = false

[rtc.managed_console_server]
enabled = true
listen_ip = "0.0.0.0"
# Empty means use server_w3c_ip after Console resolves it.
public_host = ""
port = 20128
relay_min_port = 20200
relay_max_port = 20500
realm = "pixels-console"
enable_udp = true
enable_tcp = true
credential_ttl_seconds = 300
