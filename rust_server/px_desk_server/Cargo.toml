[package]
name = "px_desk_server"
version = "3.2.9"
edition = "2021"

[features]
pg-integration = []

[dependencies]
px_release_catalog = { path = "../px_release_catalog" }
px_pg = { path = "../px_pg" }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
axum = { version = "0.8.1", features = ["json"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6.2", features = ["fs", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
subtle = "2.6"
zeroize = "1.8"
thiserror = "2"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "px_desk"
path = "src/main.rs"

[[test]]
name = "postgres_api"
required-features = ["pg-integration"]
