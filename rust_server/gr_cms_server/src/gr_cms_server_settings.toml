# name
server_name = "Srv.01"

# 此机器的IP, 如不修改则使用默认
# The ip of the machine, use default if it's empty.
server_w3c_ip = ""

# 需要对外开放的端口
# Spvr/Manager port
# TCP
spvr_port = 30500

# 需要对外开放的端口
# UDP
# DO NOT MODIFY
udp_broadcast_port = 30501

# 需要对外开放的端口
# Relay Port
relay_port = 30502

# mongodb装在本机，则不需要修改
# mongodb url
mongodb_url = "mongodb://localhost:27017/"

# redis装在本机，则不需要修改
# redis url address
redis_url = "redis://127.0.0.1:6379/"

## cert.pem
ssl_cert = "certs/cert.pem"

## key.pem
ssl_key = "certs/key.pem"