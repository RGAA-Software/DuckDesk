# listening port
server_port = 30400

# database path
db_path = "mongodb://localhost:27017/"

# verify server
# /api/v1/verify/authorization
verify_server = "https://godesk.uk:30400"

# Require app credential (appkey + HMAC signature) on open endpoints
# (device/pull, gopico/verify/online, gopico/report). Set true after all
# clients are released with the credential embedded.
require_app_credential = false

[bootstrap]
# Auto-generated on every startup; no need to set manually.
# Regenerating it invalidates existing login tokens.
jwt_secret = "CHANGE_ME_TO_A_RANDOM_SECRET_AT_LEAST_32_CHARS"

# Required only when no admin exists in MongoDB.
# Leave empty when an admin account already exists.
admin_name = "Admin"
admin_password = "AdminGoDesk@3210%!"

# Optional visitor bootstrap account. Leave password empty to skip creation.
visitor_name = "Visitor"
visitor_password = "VisitorGoDesk@3210%!"

# Generated by `cargo run --bin app_credential_gen -- --write`.
#[app_credential]
#appkey = ""
#app_secret = ""
