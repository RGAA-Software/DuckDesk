[package]
name = "px_backup"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[features]
pg-integration = []

[dependencies]
fs2 = "=0.4.3"
px_private_files = { path = "../px_private_files" }
px_server_service = { path = "../px_server_service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Services",
] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "postgres"
required-features = ["pg-integration"]
