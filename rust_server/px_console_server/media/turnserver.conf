# Bundled Coturn defaults for px_console. Pixels Console supplies listening-ip and relay-ip
# at startup from server_w3c_ip, so this file remains portable across hosts.

# TURN/STUN listener and relay allocation range. Open TCP/UDP 20128 and UDP
# 20200-20500 on the host firewall and any upstream NAT.
listening-port=20128
min-port=20200
max-port=20500

# Require authenticated long-term credentials; do not expose an anonymous relay.
lt-cred-mech
realm=px-turn.invalid
stale-nonce
fingerprint
no-multicast-peers

# TLS/DTLS certificates are not bundled for this local sidecar. Use the normal
# TURN/STUN listener above; TLS can be enabled in a deployment-specific config.
no-tls

log-file=./px_turn.log
simple-log
