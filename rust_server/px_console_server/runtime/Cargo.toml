[package]
name = "px_console_runtime"
version = "3.2.21"
edition = "2021"
rust-version = "1.88"

[features]
pg-integration = ["px_pg/pg-integration", "px_console_store/pg-integration"]

[dependencies]
px_console_store = { path = "../storage" }
px_credentials = { path = "../../px_credentials" }
px_pg = { path = "../../px_pg" }
px_node_protocol = { path = "../../px_node_protocol" }
px_private_files = { path = "../../px_private_files" }
px_relay_admission = { path = "../../px_relay_admission" }
px_relay_control_protocol = { path = "../../px_relay_control_protocol" }
px_release_catalog = { path = "../../px_release_catalog" }
px_license = { path = "../../px_auth_server/license" }
axum = { version = "0.8.1", features = ["json", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
futures-util = "0.3"
tokio = { version = "1.43", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.8"
sha2 = "0.10"
ring = "0.17"
rand = "0.9"
hex = "0.4"
url = "2"
thiserror = "2"
chrono = { version = "0.4.42", features = ["serde"] }
tracing = "0.1"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
px_relay_server = { path = "../../px_relay_server" }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid"] }
tempfile = "3"

[[test]]
name = "identity_api"
required-features = ["pg-integration"]

[[test]]
name = "directory_api"
required-features = ["pg-integration"]

[[test]]
name = "node_control"
required-features = ["pg-integration"]

[[test]]
name = "relay_control"
required-features = ["pg-integration"]

[[test]]
name = "process"
required-features = ["pg-integration"]

[[bin]]
name = "px_console"
path = "src/main.rs"

[[bin]]
name = "px_console_admin"
path = "src/bin/admin.rs"

[[test]]
name = "admin"
required-features = ["pg-integration"]
