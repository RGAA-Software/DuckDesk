[package]
name = "px_license"
version = "0.1.0"
edition = "2021"

[dependencies]
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
