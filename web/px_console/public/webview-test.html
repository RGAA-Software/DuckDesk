<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixels WebView Test</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101828;
      }
      body {
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        color: white;
      }
      main {
        width: min(76vw, 840px);
        aspect-ratio: 16 / 9;
        display: grid;
        place-items: center;
        border: 2px solid #478cff;
        border-radius: 24px;
        background: #15264a;
        box-shadow: 0 0 80px #2265cc55;
      }
      .brand {
        font-size: clamp(48px, 10vw, 112px);
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .signal {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #4ce3b2;
        box-shadow: 0 0 32px #4ce3b2;
        animation: travel 2s ease-in-out infinite alternate;
      }
      @keyframes travel {
        from {
          transform: translateX(-100px);
        }
        to {
          transform: translateX(100px);
        }
      }
    </style>
  </head>
  <body>
    <main data-pixels-webview-test>
      <div class="brand">Pixels</div>
      <div class="signal" aria-hidden="true"></div>
    </main>
  </body>
</html>
