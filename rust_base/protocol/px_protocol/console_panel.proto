syntax = "proto3";

package console_panel;

// Between Console - Panel

enum ConsolePanelMessageType {
  kConsolePanelHello = 0;
  kConsolePanelHeartBeat = 1;
  kRecordListReq = 2;
  kRecordListResp = 3;
  kRecordFetchReq = 4;
  kRecordFetchDone = 5;
  // Console -> Panel. The payload is an invalidation only; Panel pulls the
  // authenticated configuration from /api/v1/rtc/ice-config.
  kRtcIceConfigChanged = 6;
}

message ConsolePanelHello {
  string device_id = 1;
  string user_id = 2;
  string device_name = 3;
  // local NIC IPv4 list (loopback / link-local excluded), reported at handshake
  // for the console render-records view (docs/console_render_records_view_design.md 5.2)
  repeated string panel_lan_ips = 4;
  // panel http server port (records api, default 20369)
  int32 panel_http_port = 5;
}

message ConsolePanelHeartBeat {
  int64 hb_index = 1;
  string device_id = 2;
  string desktop_link = 3;
  string desktop_link_raw = 4;
  // json format hardware system info
  string sys_info_raw = 5;
  string user_id = 6;
  string device_ip_addr = 7;
  string device_name = 8;
}

message ConsoleSysInfo {
  string info = 1;
}

// ---- render records tunnel family (design doc 6.2) ----

message RecordFileInfo {
  string name = 1;
  int64 size = 2;
  // unix seconds
  int64 mtime = 3;
  string monitor = 4;
  string codec = 5;
}

// console -> panel: request the record file list of the device
message RecordListReq {
  string device_id = 1;
  string req_id = 2;
}

// panel -> console: response of RecordListReq (matched by req_id)
message RecordListResp {
  string device_id = 1;
  string req_id = 2;
  repeated RecordFileInfo files = 3;
  // non-empty when the listing failed
  string error = 4;
}

// console -> panel: fetch one record file; panel uploads it to upload_url
// (POST /api/v1/record/upload, multipart, token checked by console)
message RecordFetchReq {
  string device_id = 1;
  string req_id = 2;
  string filename = 3;
  string token = 4;
  string upload_url = 5;
}

// panel -> console: upload finished / failed
message RecordFetchDone {
  string device_id = 1;
  string req_id = 2;
  string filename = 3;
  bool ok = 4;
  string error = 5;
}

message RtcIceConfigChanged {
  uint64 revision = 1;
  int64 changed_at = 2;
}

message ConsolePanelMessage {
  ConsolePanelMessageType msg_type = 1;
  string device_id = 10;
  ConsolePanelHello hello = 20;
  ConsolePanelHeartBeat heartbeat = 30;
  ConsoleSysInfo sys_info = 40;
  RecordListReq record_list_req = 50;
  RecordListResp record_list_resp = 51;
  RecordFetchReq record_fetch_req = 52;
  RecordFetchDone record_fetch_done = 53;
  RtcIceConfigChanged rtc_ice_config_changed = 60;
}
