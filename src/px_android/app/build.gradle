import java.util.Properties
import java.util.Locale
import java.util.Base64
import java.util.UUID
import java.net.URI
import java.util.HexFormat
import java.security.MessageDigest
import java.nio.charset.StandardCharsets
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

def releaseValue = { String propertyName, String environmentName ->
    def environmentValue = System.getenv(environmentName)?.trim()
    environmentValue ? environmentValue : releaseProperties.getProperty(propertyName)?.trim()
}
def releaseStorePath = releaseValue('storeFile', 'PIXELS_KEYSTORE_FILE')
def releaseStorePassword = releaseValue('storePassword', 'PIXELS_KEYSTORE_PASSWORD')
def releaseKeyAlias = releaseValue('keyAlias', 'PIXELS_KEY_ALIAS')
def releaseKeyPassword = releaseValue('keyPassword', 'PIXELS_KEY_PASSWORD')
def releaseCertificateSha256 = releaseValue('certificateSha256', 'PIXELS_SIGNING_CERT_SHA256')
def releaseCertificateReady = releaseCertificateSha256 ==~ /(?i)[0-9a-f]{64}/
def releaseSigningReady = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it } &&
    releaseCertificateReady
def pixelsVersionCodeInput = System.getenv('PIXELS_VERSION_CODE')?.trim()
def pixelsVersionNameInput = System.getenv('PIXELS_VERSION_NAME')?.trim()
def pixelsCompanyInput = System.getenv('PIXELS_COMPANY')?.trim()
def deploymentDistribution = System.getenv('PIXELS_DISTRIBUTION')?.trim()
def configuredReleaseNamespace = System.getenv('PIXELS_RELEASE_NAMESPACE')?.trim() ?: ''
def releaseNamespace = deploymentDistribution in ['official', 'customer'] ? "pixels.${deploymentDistribution}" : configuredReleaseNamespace
def oemId = System.getenv('PIXELS_OEM_ID')?.trim() ?: ''
def oemProfileSha256 = System.getenv('PIXELS_OEM_PROFILE_SHA256')?.trim() ?: ''
def androidApplicationId = System.getenv('PIXELS_ANDROID_APPLICATION_ID')?.trim() ?: ''
def androidApplicationName = System.getenv('PIXELS_ANDROID_APPLICATION_NAME')?.trim() ?: ''
def androidBrandCompany = System.getenv('PIXELS_ANDROID_BRAND_COMPANY')?.trim() ?: ''
def androidIconForegroundPath = System.getenv('PIXELS_ANDROID_ICON_FOREGROUND_FILE')?.trim() ?: ''
def androidIconBackgroundPath = System.getenv('PIXELS_ANDROID_ICON_BACKGROUND_FILE')?.trim() ?: ''
def androidBrandResourceRoot = System.getenv('PIXELS_ANDROID_BRAND_RESOURCE_ROOT')?.trim() ?: ''
def deploymentTrustStorePath = System.getenv('PIXELS_DEPLOYMENT_TRUST_STORE_FILE')?.trim()
def deploymentTrustStoreFile = deploymentTrustStorePath ? file(deploymentTrustStorePath) : null
def deploymentTrustStoreBase64 = deploymentTrustStoreFile?.isFile() ? Base64.encoder.encodeToString(deploymentTrustStoreFile.bytes) : ''
def expectedDeploymentId = System.getenv('PIXELS_EXPECTED_DEPLOYMENT_ID')?.trim() ?: ''
def officialConsoleUrl = System.getenv('PIXELS_OFFICIAL_CONSOLE_URL')?.trim() ?: ''
def deploymentCertificateVersionInput = System.getenv('PIXELS_DEPLOYMENT_CERTIFICATE_VERSION')?.trim()
def deploymentDescriptorRevisionInput = System.getenv('PIXELS_DESCRIPTOR_REVISION')?.trim()
def deploymentTrustEpochInput = System.getenv('PIXELS_DEPLOYMENT_TRUST_EPOCH')?.trim()
def deploymentCertificateVersion = deploymentCertificateVersionInput ?: '1'
def deploymentDescriptorRevision = deploymentDescriptorRevisionInput ?: '1'
def deploymentTrustEpoch = deploymentTrustEpochInput ?: '1'
def positiveDeploymentVersion = { String value -> value ==~ /[1-9][0-9]*/ }
def canonicalTrustEpoch = { File trustStoreFile ->
    try {
        byte[] bytes = trustStoreFile.bytes
        def parsed = new JsonSlurper().parse(bytes, StandardCharsets.UTF_8.name())
        if (!(parsed instanceof Map) || parsed.keySet() != ['schema_version', 'trust_epoch', 'trusted_keys'] as Set) return null
        if (parsed.schema_version != 1 || !(parsed.trust_epoch instanceof Number) || parsed.trust_epoch.longValue() <= 0 ||
            parsed.trust_epoch.doubleValue() != parsed.trust_epoch.longValue().doubleValue()) return null
        if (!(parsed.trusted_keys instanceof List) || parsed.trusted_keys.size() < 1 || parsed.trusted_keys.size() > 16) return null
        def previousKeyId = null
        def canonicalKeys = []
        for (def trustedKey : parsed.trusted_keys) {
            if (!(trustedKey instanceof Map) || trustedKey.keySet() != ['key_id', 'public_key_hex'] as Set) return null
            def keyId = trustedKey.key_id
            def publicKeyHex = trustedKey.public_key_hex
            if (!(keyId instanceof String) || !(publicKeyHex instanceof String) ||
                !(keyId ==~ /[0-9a-f]{64}/) || !(publicKeyHex ==~ /[0-9a-f]{64}/) ||
                previousKeyId != null && previousKeyId >= keyId) return null
            byte[] publicKey = HexFormat.of().parseHex(publicKeyHex)
            def computedKeyId = HexFormat.of().formatHex(MessageDigest.getInstance('SHA-256').digest(publicKey))
            if (computedKeyId != keyId || publicKey.every { it == 0 }) return null
            canonicalKeys += "{\"key_id\":\"${keyId}\",\"public_key_hex\":\"${publicKeyHex}\"}"
            previousKeyId = keyId
        }
        def canonical = "{\"schema_version\":1,\"trust_epoch\":${parsed.trust_epoch.longValue()},\"trusted_keys\":[${canonicalKeys.join(',')}]}"
        return Arrays.equals(bytes, canonical.getBytes(StandardCharsets.UTF_8)) ? parsed.trust_epoch.longValue() : null
    } catch (Exception ignored) {
        return null
    }
}
def hasExplicitProductVersion = pixelsVersionCodeInput && pixelsVersionNameInput
def requestedArtifactTask = gradle.startParameter.taskNames.any { requestedTask ->
    def taskName = requestedTask.tokenize(':').last().toLowerCase(Locale.ROOT)
    taskName == 'build' || taskName == 'assemble' || taskName.startsWith('assemble') ||
        taskName == 'bundle' || taskName.startsWith('bundle') ||
        taskName == 'install' || taskName.startsWith('install') ||
        taskName == 'package' || taskName.startsWith('package')
}
def requestedDistributionValidation = requestedArtifactTask || System.getenv('PIXELS_VALIDATE_DISTRIBUTION') == '1'
def requestedReleaseValidation = System.getenv('PIXELS_VALIDATE_RELEASE') == '1'
if (requestedArtifactTask && !hasExplicitProductVersion) {
    throw new GradleException(
        'APK/AAB tasks require PIXELS_VERSION_NAME and PIXELS_VERSION_CODE from scripts_build/build_android_product.bat.'
    )
}
if (requestedArtifactTask && pixelsCompanyInput != 'Pixels') {
    throw new GradleException('APK/AAB tasks require PIXELS_COMPANY=Pixels from the Android product manifest.')
}
if (requestedDistributionValidation && !(deploymentDistribution in ['official', 'customer', 'oem'])) {
    throw new GradleException('APK/AAB tasks require PIXELS_DISTRIBUTION=official, customer or oem.')
}
def oemBuildInputs = [
    oemId,
    oemProfileSha256,
    androidApplicationId,
    androidApplicationName,
    androidBrandCompany,
    androidIconForegroundPath,
    androidIconBackgroundPath,
]
if (requestedDistributionValidation && deploymentDistribution != 'oem' &&
    ([configuredReleaseNamespace, androidBrandResourceRoot] + oemBuildInputs).any { oemBuildInput -> oemBuildInput }) {
    throw new GradleException('Official/Customer APK/AAB tasks must not configure OEM build inputs.')
}
if (requestedDistributionValidation && deploymentDistribution == 'oem') {
    if (oemBuildInputs.any { oemBuildInput -> !oemBuildInput }) {
        throw new GradleException('OEM APK/AAB tasks require the complete immutable OEM Android build configuration.')
    }
    if (releaseNamespace != "oem.${oemId}" || !(oemId ==~ /[a-z0-9](?:[a-z0-9-]{1,30}[a-z0-9])?/) ||
        !(oemProfileSha256 ==~ /[0-9a-f]{64}/) || !(androidApplicationId ==~ /[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*){2,}/) ||
        androidApplicationId.startsWith('yun.pixels.')) {
        throw new GradleException('OEM Android identity inputs are not canonical or independent from Pixels application identity.')
    }
    if (![androidIconForegroundPath, androidIconBackgroundPath].every { iconPath -> new File(iconPath).isFile() }) {
        throw new GradleException('OEM Android icon inputs are missing.')
    }
    if (requestedArtifactTask && (!androidBrandResourceRoot || !file(androidBrandResourceRoot).isDirectory())) {
        throw new GradleException('OEM artifact tasks require the prepared generated brand resource directory.')
    }
}
if (requestedDistributionValidation && !deploymentTrustStoreFile?.isFile()) {
    throw new GradleException('APK/AAB tasks require PIXELS_DEPLOYMENT_TRUST_STORE_FILE with the approved canonical public trust store.')
}
if (requestedDistributionValidation && ![
    deploymentCertificateVersionInput,
    deploymentDescriptorRevisionInput,
    deploymentTrustEpochInput,
].every(positiveDeploymentVersion)) {
    throw new GradleException(
        'APK/AAB tasks require positive integer PIXELS_DEPLOYMENT_CERTIFICATE_VERSION, PIXELS_DESCRIPTOR_REVISION and ' +
            'PIXELS_DEPLOYMENT_TRUST_EPOCH values.'
    )
}
if (requestedDistributionValidation) {
    def trustEpoch = canonicalTrustEpoch(deploymentTrustStoreFile)
    if (trustEpoch == null || trustEpoch.toString() != deploymentTrustEpoch) {
        throw new GradleException(
            'PIXELS_DEPLOYMENT_TRUST_STORE_FILE must be canonical and its trust_epoch must equal PIXELS_DEPLOYMENT_TRUST_EPOCH.'
        )
    }
}
if (requestedDistributionValidation && deploymentDistribution == 'official' && (!expectedDeploymentId || !officialConsoleUrl)) {
    throw new GradleException('Official APK/AAB tasks require PIXELS_EXPECTED_DEPLOYMENT_ID and PIXELS_OFFICIAL_CONSOLE_URL.')
}
if (requestedDistributionValidation && deploymentDistribution == 'official') {
    def canonicalDeploymentId = null
    try {
        canonicalDeploymentId = UUID.fromString(expectedDeploymentId).toString()
    } catch (IllegalArgumentException ignored) {
        // The common error below deliberately does not echo untrusted build input.
    }
    if (canonicalDeploymentId != expectedDeploymentId) {
        throw new GradleException('PIXELS_EXPECTED_DEPLOYMENT_ID must be a canonical non-nil UUID.')
    }
    if (canonicalDeploymentId == '00000000-0000-0000-0000-000000000000') {
        throw new GradleException('PIXELS_EXPECTED_DEPLOYMENT_ID must not be the nil UUID.')
    }
    def parsedOfficialConsoleUrl = null
    try {
        parsedOfficialConsoleUrl = new URI(officialConsoleUrl)
    } catch (Exception ignored) {
        // The common error below deliberately does not echo untrusted build input.
    }
    if (parsedOfficialConsoleUrl == null || parsedOfficialConsoleUrl.scheme != 'https' || !parsedOfficialConsoleUrl.host ||
        parsedOfficialConsoleUrl.userInfo || parsedOfficialConsoleUrl.query || parsedOfficialConsoleUrl.fragment ||
        !(parsedOfficialConsoleUrl.path in ['', '/'])) {
        throw new GradleException('PIXELS_OFFICIAL_CONSOLE_URL must be an HTTPS origin without credentials, path, query or fragment.')
    }
}
if (requestedDistributionValidation && deploymentDistribution in ['customer', 'oem'] && (expectedDeploymentId || officialConsoleUrl)) {
    throw new GradleException('Customer/OEM APK/AAB tasks must not configure the official deployment ID or official Console URL.')
}
if (requestedReleaseValidation && !releaseSigningReady) {
    throw new GradleException(
        'Android release preflight requires complete signing credentials and the approved signing certificate SHA-256.'
    )
}
if (requestedReleaseValidation && !rootProject.file(releaseStorePath).isFile()) {
    throw new GradleException('Android release preflight cannot read the configured keystore file.')
}
def pixelsVersionCode = (pixelsVersionCodeInput ?: '1').toInteger()
def pixelsVersionName = pixelsVersionNameInput ?: '1.0.0'
def pixelsCompany = pixelsCompanyInput ?: 'Pixels'
def pixelsGitRevision = System.getenv('PIXELS_GIT_REVISION') ?: 'unknown'
def releaseComplianceDriver = System.getenv('PIXELS_RELEASE_COMPLIANCE_DRIVER') == '1'
def effectiveApplicationId = deploymentDistribution == 'customer' ? 'yun.pixels.client.customer' :
    deploymentDistribution == 'oem' ? androidApplicationId : 'yun.pixels.client'
def effectiveApplicationName = deploymentDistribution == 'oem' ? androidApplicationName : 'Pixels'
def effectiveBrandCompany = deploymentDistribution == 'oem' ? androidBrandCompany : 'Pixels'
def launcherIconResource = deploymentDistribution == 'oem' ? '@mipmap/ic_oem_launcher' : '@mipmap/ic_launcher'
def roundLauncherIconResource = deploymentDistribution == 'oem' ? '@mipmap/ic_oem_launcher_round' : '@mipmap/ic_launcher_round'
def javaStringLiteral = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '\\r').replace('\n', '\\n') + '"'
}

if (pixelsVersionCode <= 0 || !(pixelsVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?/)) {
    throw new GradleException('PIXELS_VERSION_CODE must be positive and PIXELS_VERSION_NAME must use semantic version syntax.')
}

tasks.register('validateDistributionConfiguration') {
    group = 'verification'
    description = 'Validates Android distribution identity inputs without producing an artifact.'
}

tasks.register('validateReleaseConfiguration') {
    group = 'verification'
    description = 'Validates Android distribution and release signing inputs without producing an artifact.'
}

android {
    namespace = 'yun.pixels.client'
    compileSdk = 37

    defaultConfig {
        applicationId = effectiveApplicationId
        minSdk = 31
        targetSdk = 37
        versionCode = pixelsVersionCode
        versionName = pixelsVersionName
        buildConfigField 'String', 'GIT_REVISION', "\"${pixelsGitRevision}\""
        buildConfigField 'String', 'COMPANY', javaStringLiteral(effectiveBrandCompany)
        buildConfigField 'String', 'APPLICATION_NAME', javaStringLiteral(effectiveApplicationName)
        buildConfigField 'String', 'DEPLOYMENT_DISTRIBUTION', "\"${deploymentDistribution ?: ''}\""
        buildConfigField 'String', 'RELEASE_NAMESPACE', "\"${releaseNamespace}\""
        buildConfigField 'String', 'OEM_ID', "\"${oemId}\""
        buildConfigField 'String', 'OEM_PROFILE_SHA256', "\"${oemProfileSha256}\""
        buildConfigField 'String', 'DEPLOYMENT_TRUST_STORE_BASE64', "\"${deploymentTrustStoreBase64}\""
        buildConfigField 'String', 'EXPECTED_DEPLOYMENT_ID', "\"${expectedDeploymentId}\""
        buildConfigField 'String', 'OFFICIAL_CONSOLE_URL', "\"${officialConsoleUrl}\""
        buildConfigField 'long', 'MINIMUM_DEPLOYMENT_CERTIFICATE_VERSION', "${deploymentCertificateVersion}L"
        buildConfigField 'long', 'MINIMUM_DESCRIPTOR_REVISION', "${deploymentDescriptorRevision}L"
        buildConfigField 'long', 'DEPLOYMENT_TRUST_EPOCH', "${deploymentTrustEpoch}L"
        manifestPlaceholders = [
            applicationIcon: launcherIconResource,
            applicationRoundIcon: roundLauncherIconResource,
        ]
        if (deploymentDistribution == 'oem') {
            resValue 'string', 'app_name', effectiveApplicationName
        }

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters += ['arm64-v8a']
        }

    }

    if (deploymentDistribution == 'oem' && androidBrandResourceRoot) {
        sourceSets {
            main.res.srcDir androidBrandResourceRoot
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = rootProject.file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        compose = true
        resValues = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        // Gradle 9.3.1 is AGP 9.1.1's documented default. Newer standalone
        // Gradle releases are not necessarily supported by this AGP line.
        disable 'AndroidGradlePluginVersion', 'ChromeOsAbiSupport'
    }

}

def signedReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase(Locale.ROOT)
    normalized ==~ /(?::?app:)?(?:assemble|bundle|install)release/
}
if (signedReleaseTaskRequested && !releaseSigningReady) {
    throw new GradleException(
        'A release package requires PIXELS_KEYSTORE_FILE, PIXELS_KEYSTORE_PASSWORD, PIXELS_KEY_ALIAS, PIXELS_KEY_PASSWORD and ' +
            'the approved 64-hex PIXELS_SIGNING_CERT_SHA256 ' +
            'or the equivalent values in the ignored keystore.properties file.',
    )
}
if (signedReleaseTaskRequested && !releaseComplianceDriver) {
    throw new GradleException(
        'Release packages must be built through scripts_build/build_android_product.bat release so corresponding source, ' +
            'relink objects, symbols, signatures and the release manifest are generated and verified together.',
    )
}

dependencies {
    implementation project(':core-domain')
    implementation project(':core-data')
    implementation project(':core-network')
    implementation project(':core-native')
    implementation project(':feature-devices')
    implementation project(':feature-cloud-apps')
    implementation project(':feature-remote')
    implementation project(':feature-transfer')
    implementation project(':feature-settings')

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
