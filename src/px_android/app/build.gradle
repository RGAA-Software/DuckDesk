import java.util.Properties
import java.util.Locale

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

def releaseValue = { String propertyName, String environmentName ->
    def environmentValue = System.getenv(environmentName)?.trim()
    environmentValue ? environmentValue : releaseProperties.getProperty(propertyName)?.trim()
}
def releaseStorePath = releaseValue('storeFile', 'PIXELS_KEYSTORE_FILE')
def releaseStorePassword = releaseValue('storePassword', 'PIXELS_KEYSTORE_PASSWORD')
def releaseKeyAlias = releaseValue('keyAlias', 'PIXELS_KEY_ALIAS')
def releaseKeyPassword = releaseValue('keyPassword', 'PIXELS_KEY_PASSWORD')
def releaseSigningReady = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def pixelsVersionCode = (System.getenv('PIXELS_VERSION_CODE') ?: '1').toInteger()
def pixelsVersionName = System.getenv('PIXELS_VERSION_NAME') ?: '1.0.0'
def pixelsGitRevision = System.getenv('PIXELS_GIT_REVISION') ?: 'unknown'

if (pixelsVersionCode <= 0 || !(pixelsVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?/)) {
    throw new GradleException('PIXELS_VERSION_CODE must be positive and PIXELS_VERSION_NAME must use semantic version syntax.')
}

android {
    namespace = 'yun.pixels.client'
    compileSdk = 37

    defaultConfig {
        applicationId = 'yun.pixels.client'
        minSdk = 31
        targetSdk = 37
        versionCode = pixelsVersionCode
        versionName = pixelsVersionName
        buildConfigField 'String', 'GIT_REVISION', "\"${pixelsGitRevision}\""

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters += ['arm64-v8a']
        }

    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = rootProject.file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        // Gradle 9.3.1 is AGP 9.1.1's documented default. Newer standalone
        // Gradle releases are not necessarily supported by this AGP line.
        disable 'AndroidGradlePluginVersion', 'ChromeOsAbiSupport'
    }

}

def signedReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase(Locale.ROOT)
    normalized.endsWith('assemblerelease') || normalized.endsWith('bundlerelease') || normalized.endsWith('installrelease')
}
if (signedReleaseTaskRequested && !releaseSigningReady) {
    throw new GradleException(
        'A release package requires PIXELS_KEYSTORE_FILE, PIXELS_KEYSTORE_PASSWORD, PIXELS_KEY_ALIAS and PIXELS_KEY_PASSWORD ' +
            'or the equivalent values in the ignored keystore.properties file.',
    )
}

dependencies {
    implementation project(':core-domain')
    implementation project(':core-data')
    implementation project(':core-network')
    implementation project(':core-native')
    implementation project(':feature-devices')
    implementation project(':feature-remote')
    implementation project(':feature-transfer')
    implementation project(':feature-settings')

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
