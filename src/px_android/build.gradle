buildscript {
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
    }
}

plugins {
    id 'com.android.application' version '9.1.1' apply false
    id 'com.android.library' version '9.1.1' apply false
    id 'com.google.protobuf' version '0.10.0' apply false
    id 'com.google.devtools.ksp' version '2.3.10' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
}

def pixelsAndroidBuildRoot = System.getenv('PIXELS_ANDROID_BUILD_ROOT')?.trim()
if (pixelsAndroidBuildRoot) {
    allprojects { targetProject ->
        def directoryName = targetProject == rootProject ? 'root' : targetProject.name
        targetProject.layout.buildDirectory.set(file("${pixelsAndroidBuildRoot}/${directoryName}"))
    }
}
