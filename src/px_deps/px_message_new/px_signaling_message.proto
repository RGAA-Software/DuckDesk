syntax = "proto3";

package px;

message SigOfferSdpMessage {
  string device_id = 1;
  string room_id = 2;
  string sdp = 3;
  string connection_ticket = 4;
  string client_nonce = 5;
  string instance_id = 6;
}

message SigAnswerSdpMessage {
  string device_id = 1;
  string room_id = 2;
  string sdp = 3;
}

message SigIceMessage {
  string device_id = 1;
  string room_id = 2;
  string ice = 3;
  string mid = 4;
  int32 sdp_mline_index = 5;
}
