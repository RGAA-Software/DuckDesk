syntax = "proto3";

package pxcp;

enum CpMessageType {
  kCpHello = 0;
  kCpHeartBeat = 1;
  kCpOnHeartBeat = 2;
  kCpFileTransferBegin = 10;
  kCpFileTransferEnd = 20;
  // Panel -> an already connected desktop client. The client opens its
  // in-process file manager and reuses the established transport.
  kCpOpenFileTransfer = 30;
  // Panel -> an already connected standard WebRTC client. Applies a fresh
  // Console ICE snapshot and performs an in-place ICE restart.
  kCpRtcIceRestart = 40;
  kCpRtcIceRestartRequest = 41;
}

// UI server
enum CpSessionType {
  kInnerServer = 0;
  kAndroidClient = 1;
  kWindowsClient = 2;
}

message CpPtMsgHello {
  CpSessionType type = 1;
}

message CpPtMsgHeartBeat {
  string remote_device_desktop_name = 1;
  string remote_os_name = 2;
}

message CpPtMsgOnHeartBeat {

}

message CpFileTransferBegin {
  string the_file_id = 1;
  int64 begin_timestamp = 2;
  string direction = 3;
  string file_detail = 4;
  string remote_device_id = 5;
}

message CpFileTransferEnd {
  string the_file_id = 1;
  int64 end_timestamp = 2;
  int64 duration = 3;
  bool success = 4;
  // Stable terminal semantics. Empty fields mean a legacy sender; receivers
  // derive succeeded/failed from success in that case.
  string status = 5;
  string end_reason = 6;
}

message CpRtcIceRestart {
  string connection_ticket = 1;
  string client_nonce = 2;
  string instance_id = 3;
  string ice_config_json = 4;
  uint64 revision = 5;
}

message CpMessage {
  CpMessageType type = 1;
  string stream_id = 2;
  CpPtMsgHello hello = 5;
  CpPtMsgHeartBeat heartbeat= 10;
  CpPtMsgOnHeartBeat on_heartbeat = 20;
  CpFileTransferBegin ft_transfer_beg = 30;
  CpFileTransferEnd ft_transfer_end = 40;
  CpRtcIceRestart rtc_ice_restart = 50;
}
