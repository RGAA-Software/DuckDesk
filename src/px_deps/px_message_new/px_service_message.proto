syntax = "proto3";

package px;

enum ServiceMessageType {
  kSrvStartServer = 0;
  kSrvStopServer = 1;
  kSrvRestartServer = 2;
  kSrvHeartBeat = 3;
  kSrvHeartBeatResp = 4;
  kSrvReqCtrlAltDelete = 5;
  kSrvAuthInfo = 6;
  kSrvRedeemConnectionTicket = 7;
  kSrvRedeemConnectionTicketResp = 8;
  kSrvVirtualDisplayRequest = 9;
  kSrvVirtualDisplayResult = 10;
  kSrvAppInstanceReady = 11;
}

enum VirtualDisplayOperation {
  kVirtualDisplayCreate = 0;
  kVirtualDisplayRemoveLast = 1;
  kVirtualDisplayQuery = 2;
  kVirtualDisplayResetOwned = 3;
}

message MsgStartServer {
  string work_dir = 1;
  string app_path = 2;
  repeated string args = 3;
}

message MsgStopServer {

}

message MsgRestartServer {
  string work_dir = 1;
  string app_path = 2;
  repeated string args = 3;
}

enum RenderStatus {
  kStopped = 0;
  kWorking = 2;
}

message MsgAuthInfo {
  string device_id = 1;
  string auth_id = 2;
  string auth_name = 3;
  string machine_code = 4;
  string appkey = 5;
  int32 role = 6;
  int32 days = 7;
  int32 max_streams = 8;
  int64 end_timestamp_ms = 9;
  // console(Console) server address, so the service can connect to Console
  string console_host = 10;
  int32 console_port = 11;
  // whether the Console websocket connection uses TLS (wss) or plain ws
  bool console_ssl = 12;
}

message MsgHeartBeat {
  int64 index = 1;
  string from = 2;
  // panel carries its latest authorization info on every heartbeat
  MsgAuthInfo auth_info = 3;
}

message MsgHeartBeatResp {
  int64 index = 1;
  RenderStatus render_status = 2;
}

message MsgReqCtrlAltDelete {
  string req_device_id = 1;
  string req_stream_id = 2;
}

message MsgRedeemConnectionTicket {
  string request_id = 1;
  string ticket = 2;
  string client_nonce = 3;
  string instance_id = 4;
}

message MsgConnectionGrant {
  string kind = 1;
  string device_id = 2;
  string app_id = 3;
  string instance_id = 4;
  string subject_type = 5;
  string subject_id = 6;
  repeated string permissions = 7;
  int64 expires_at = 8;
}

message MsgRedeemConnectionTicketResp {
  string request_id = 1;
  bool ok = 2;
  string code = 3;
  MsgConnectionGrant grant = 4;
  string rtc_ice_config_json = 5;
}

message MsgVirtualDisplayRequest {
  string request_id = 1;
  VirtualDisplayOperation operation = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 refresh_hz = 5;
}

message MsgVirtualDisplayResult {
  string request_id = 1;
  bool accepted = 2;
  bool topology_changed = 3;
  uint64 topology_generation = 4;
  string logical_display_id = 5;
  string error_code = 6;
  string error_message = 7;
  uint32 owned_display_count = 8;
  uint32 actual_virtual_display_count = 9;
  bool driver_installed = 10;
  bool package_valid = 11;
  bool removal_safe = 12;
  string phase = 13;
}

message MsgAppInstanceReady {
  string instance_id = 1;
  int32 listen_port = 2;
  bool ok = 3;
  string error = 4;
}

message ServiceMessage {
  ServiceMessageType type = 1;
  MsgStartServer start_server = 2;
  MsgStopServer stop_server = 3;
  MsgRestartServer restart_server = 4;
  MsgHeartBeat heart_beat = 5;
  MsgHeartBeatResp heart_beat_resp = 6;
  MsgReqCtrlAltDelete req_ctrl_alt_delete = 7;
  // sent by panel right after connecting, and embedded in every heartbeat
  MsgAuthInfo auth_info = 8;
  MsgRedeemConnectionTicket redeem_connection_ticket = 9;
  MsgRedeemConnectionTicketResp redeem_connection_ticket_resp = 10;
  MsgVirtualDisplayRequest virtual_display_request = 11;
  MsgVirtualDisplayResult virtual_display_result = 12;
  MsgAppInstanceReady app_instance_ready = 13;
}
