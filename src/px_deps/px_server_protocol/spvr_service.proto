syntax = "proto3";

package spvr_service;

// Between Spvr (CMS) - GoDesk Windows Service (GammaRayService)
// See docs/cms_app_schedule_plan.md

enum SpvrServiceMessageType {
  kSpvrServiceHello = 0;
  kSpvrServiceHeartBeat = 1;
  // CMS -> Service
  kSpvrServiceStartAppInstance = 2;
  kSpvrServiceStopAppInstance = 3;
  // Service -> CMS
  kSpvrServiceStartAppInstanceResult = 4;
  kSpvrServiceStopAppInstanceResult = 5;
}

message SpvrServiceHello {
  string device_id = 1;
  string appkey = 2;
  string version = 3;
}

message SpvrServiceHeartBeat {
  int64 hb_index = 1;
  string device_id = 2;
  bool render_alive = 3;
  // json format authorization info reported by the panel (may be empty)
  string auth_info_json = 4;
  // json array of local app instance summaries (may be empty)
  // [{instance_id, app_id, listen_port, pid, state}, ...]
  string instances_json = 5;
}

message SpvrServiceStartAppInstance {
  string request_id = 1;
  string instance_id = 2;
  string app_id = 3;
  // Absolute install root on this machine (Placement.install_root)
  string install_root = 4;
  // Relative exe path under install_root (Application.game_exe_rel)
  string game_exe_rel = 5;
  string game_arguments = 6;
  // 0 = Service allocates an available port
  int32 listen_port = 7;
  int32 encoder_fps = 8;
  int32 encoder_bitrate = 9;
  string encoder_format = 10;
  bool webrtc_enabled = 11;
  bool websocket_enabled = 12;
}

message SpvrServiceStopAppInstance {
  string request_id = 1;
  string instance_id = 2;
}

message SpvrServiceStartAppInstanceResult {
  string request_id = 1;
  string instance_id = 2;
  bool ok = 3;
  string error = 4;
  int32 listen_port = 5;
  uint32 pid = 6;
}

message SpvrServiceStopAppInstanceResult {
  string request_id = 1;
  string instance_id = 2;
  bool ok = 3;
  string error = 4;
}

message SpvrServiceMessage {
  SpvrServiceMessageType msg_type = 1;
  string device_id = 10;
  SpvrServiceHello hello = 20;
  SpvrServiceHeartBeat heartbeat = 30;
  SpvrServiceStartAppInstance start_app_instance = 40;
  SpvrServiceStopAppInstance stop_app_instance = 50;
  SpvrServiceStartAppInstanceResult start_app_instance_result = 60;
  SpvrServiceStopAppInstanceResult stop_app_instance_result = 70;
}
